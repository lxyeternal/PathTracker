# nginx site for waytrace.cn. HTTPS is added once the certificate is in place.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name waytrace.cn www.waytrace.cn;

    root /var/www/waytrace;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Pictures change only with a new release.
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
