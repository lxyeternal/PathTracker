# nginx site for waytrace.cn. HTTPS is added once the certificate is in place.
server {
    server_name waytrace.cn www.waytrace.cn;

    root /var/www/waytrace;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Pictures change only with a new release.
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/waytrace.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/waytrace.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.waytrace.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = waytrace.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name waytrace.cn www.waytrace.cn;
    return 404; # managed by Certbot




}